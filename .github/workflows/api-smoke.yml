name: NBA API Smoke Test

on:
  push:
    paths:
      - ".github/workflows/api-smoke.yml"
  workflow_dispatch:

jobs:
  probe-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Probe NBA matchup endpoints
        shell: bash
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"

          urls=(
            "https://stats.nba.com/stats/boxscorematchupsv3?GameID=0042500311"
            "https://nba.cloud/games/0042500311/boxscorematchups?Format=json"
            "http://nba.cloud/games/0042500311/boxscorematchups?Format=json"
            "https://cdn.nba.com/static/json/liveData/boxscorematchups/boxscorematchups_0042500311.json"
          )

          for url in "${urls[@]}"; do
            echo "=== $url ==="
            code=$(curl -L -sS \
              -A "$UA" \
              -H "Accept: application/json, text/plain, */*" \
              -H "Referer: https://www.nba.com/" \
              -H "Origin: https://www.nba.com" \
              --connect-timeout 8 \
              --max-time 20 \
              -o /tmp/nba_probe \
              -w "%{http_code}" \
              "$url")
            echo "HTTP $code"
            echo "Bytes: $(wc -c < /tmp/nba_probe 2>/dev/null || echo 0)"
            head -c 160 /tmp/nba_probe 2>/dev/null || true
            echo
            echo
          done
