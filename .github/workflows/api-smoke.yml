name: NBA API Smoke Test

on:
  push:
    paths:
      - ".github/workflows/api-smoke.yml"
  workflow_dispatch:

jobs:
  compare-game-1:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and data dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-data.txt

      - name: Compare API with manual Game 1
        run: |
          python -m scripts.compare_api_manual \
            --game-id 0042500311 \
            --game-number 1
